# SurrealDB program for the single-container image only.
# Included in every runtime image; SURREAL_EMBEDDED controls whether it starts.

[program:surrealdb]
; Keep credentials out of argv. The platform-friendly SURREAL_DATA_PATH can
; place the database under /app/data so one persistent volume protects both
; database records and application uploads.
command=sh -c "export SURREAL_PASS=${SURREAL_PASSWORD:-root}; export SURREAL_PATH=${SURREAL_DATA_PATH:-/mydata}/mydatabase.db; exec surreal start --log info"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5
autostart=%(ENV_SURREAL_EMBEDDED)s
startsecs=5
